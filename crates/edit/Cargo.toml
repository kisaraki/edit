[package]
name = "edit"
# EN: Cargo keeps Microsoft's SemVer source version; build/main.rs separately declares tzk 0.0.8.
# 中文：Cargo 保留 Microsoft 原始 SemVer；tzk 0.0.8 由 build/main.rs 獨立宣告。
version = "2.0.0"

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

build = "build/main.rs"
categories = ["text-editors"]

[[bench]]
name = "lib"
harness = false

[features]
# Display editor latency in the top-right corner
debug-latency = []

[dependencies]
# EN: Resolve standard user directories through one portable dependency on every supported OS.
# 中文：在所有支援的作業系統上，透過單一可攜式相依套件解析使用者標準目錄。
dirs = "6.0.0"
lsh.workspace = true
stdext.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
stdext.workspace = true
lsh.workspace = true
# The default toml crate bundles its dependencies with bad compile times. Thanks.
# Thankfully toml-span exists. FWIW the alternative is yaml-rust (without the 2 suffix).
toml-span = { version = "0.7", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
zstd = { version = "0.13", default-features = false }
